services:
  database:
    image: postgres:17
    environment:
      POSTGRES_DB: verixa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: verixa_local
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - verixa_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d verixa"]
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  verixa_database:
